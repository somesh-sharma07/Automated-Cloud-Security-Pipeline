name: DevSecOps Security Gate & Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  secret-scan:
    name: 0. Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code (Full Git History)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-scan:
    name: 1. Security Scan & AI Audit
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dashboard_ready: ${{ steps.auditor.outputs.dashboard_ready }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Checkov Terraform Scan (JSON Report)
        id: checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          external_checks_dirs: custom_policies
          output_format: json
          output_file_path: checkov-results
          soft_fail: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Gemini GenAI SDK
        run: pip install --quiet google-genai

      - name: Run Python Security Auditor & Generate Dashboard
        id: auditor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/security_auditor.py

      - name: Upload Dashboard Artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard

      - name: Enforce Shift-Left Security Gate
        if: steps.checkov.outcome == 'failure'
        run: |
          echo "Security gate failed! Live dashboard updated with Gemini AI remediation patches. Blocking AWS deployment."
          exit 1

  publish-dashboard:
    name: 2A. Publish Live Dashboard
    needs: security-scan
    if: always() && needs.security-scan.outputs.dashboard_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy:
    name: 2B. Terraform Deploy to AWS
    needs: security-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color