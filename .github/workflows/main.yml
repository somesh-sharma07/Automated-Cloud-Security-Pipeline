name: DevSecOps Security Gate

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  security-scan:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          soft_fail: false